<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/summernote/0.8.12/summernote-bs4.css" rel="stylesheet">
    <title>Editar Post</title>
</head>

<body>

    <header>
        <!-- As a heading -->
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1"><a id="nomenavbar" class="logo" href="/index.html">Code
                        Blog</a></span>
            </div>
        </nav>
    </header>

    <div class="container" style="width: 60%; padding-bottom: 30px;">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item" aria-current="page" style="padding-top: 30px; font-size: 18px;"><a
                        href="/index.html">Posts</a></li>
                <li class="breadcrumb-item active" aria-current="page" style="padding-top: 30px; font-size: 18px;">
                    Editar Post
                </li>
            </ol>
        </nav>

    </div>

    <form id="formEditarPost" data-formulario class="formpost">
        <div class="form-group">
            <input type="text" class="form-control" name="titulo" placeholder="Título *" id="titulo" data-titulo>
        </div>
        <div class="form-group">
            <input type="text" class="form-control" name="autor" placeholder="Autor *" id="autor" data-autor>
        </div>

        <textarea id="summernote" type="text" class="form-control" name="texto" placeholder="Texto *"
            data-texto></textarea>

        <small class="form-text text-muted">(*) Campos obrigatórios</small>
        <div class="botoes">
            <input type="submit" class="btn-enviar" value="Editar">
            <a href="/index.html" class="btn-cancelar" role="button" style="margin-top: px;">Cancelar</a>
        </div>
    </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/summernote/0.8.12/summernote-bs4.js"></script>
    <script>
        $('#summernote').summernote({
            placeholder: 'Texto *',
            tabsize: 2,
            height: 300
        });
    </script>

    <script
    src="/js/editarpost.js"
    type="module">
</script>

</body>

</html>
